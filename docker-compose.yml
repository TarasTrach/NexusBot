services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexusbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexusbot}
      POSTGRES_DB: ${POSTGRES_DB:-nexusbot}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexusbot} -d ${POSTGRES_DB:-nexusbot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    volumes:
      - ytdlp-bin:/app/bin
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  ytdlp-bin:
